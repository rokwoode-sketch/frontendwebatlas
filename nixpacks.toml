# Fallback if EasyPanel uses Nixpacks instead of Dockerfile
[phases.setup]
nixPkgs = ["nodejs_22"]

# install phase already runs `npm ci` — do not repeat it here (causes EBUSY cache error)
[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3000"
NEXT_TELEMETRY_DISABLED = "1"
NODE_OPTIONS = "--max-old-space-size=1536"
